# Configuração do Nginx que serve o front Angular e faz proxy da API.
# O front chama a API em '/api' (ver environment.prod.ts), e este proxy
# encaminha para o serviço 'api' do docker-compose — mesma origem, sem CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compactação básica.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Proxy da API: /api/... -> http://api:8000/...
    # (remove o prefixo /api antes de encaminhar).
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: qualquer rota desconhecida serve o index.html
    # (senão o refresh em rotas internas do Angular dá 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
