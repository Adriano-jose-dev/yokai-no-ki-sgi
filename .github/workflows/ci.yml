name: CI

# Gatilhos: valida a cada push e pull request na branch main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Back-end: instala dependências e roda a suíte de testes (pytest).
  # O código do back-end vive em backend/.
  # ---------------------------------------------------------------------------
  backend:
    name: Back-end (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Front-end: instala dependências e roda o build de produção do Angular,
  # garantindo que nada quebre a compilação. O projeto Angular vive em frontend/.
  # ---------------------------------------------------------------------------
  frontend:
    name: Front-end (build Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
